name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'lib/exwiw/version.rb'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version and check tag
        id: check_tag
        run: |
          VERSION=$(grep -E 'VERSION\s*=' lib/exwiw/version.rb | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version extracted: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.check_tag.outputs.skip != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Release gem (build, tag, push via OIDC)
        if: steps.check_tag.outputs.skip != 'true'
        uses: rubygems/release-gem@v1

      - name: Extract release notes from CHANGELOG
        if: steps.check_tag.outputs.skip != 'true'
        id: notes
        env:
          VERSION: ${{ steps.check_tag.outputs.version }}
        run: |
          NOTES=$(ruby <<'RUBY'
          version = ENV["VERSION"]
          content = File.read("CHANGELOG.md")
          if content =~ /^## \[#{Regexp.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\z)/m
            print $1.strip
          else
            print "Release v#{version}"
          end
          RUBY
          )
          {
            echo "notes<<__NOTES_EOF__"
            echo "$NOTES"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check_tag.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$NOTES"
