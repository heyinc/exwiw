name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'lib/exwiw/version.rb'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version and check tag
        id: check_tag
        run: |
          VERSION=$(grep -E 'VERSION\s*=' lib/exwiw/version.rb | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.(alpha|beta|rc)[0-9]+)?$ ]]; then
            echo "::error::Invalid version extracted: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ \.(alpha|beta|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.check_tag.outputs.skip != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Release gem (build, tag, push via OIDC)
        if: steps.check_tag.outputs.skip != 'true'
        uses: rubygems/release-gem@v1

      - name: Extract release notes from CHANGELOG
        if: steps.check_tag.outputs.skip != 'true'
        id: notes
        env:
          VERSION: ${{ steps.check_tag.outputs.version }}
          PRERELEASE: ${{ steps.check_tag.outputs.prerelease }}
        run: |
          NOTES=$(ruby <<'RUBY'
          version = ENV["VERSION"]
          # A prerelease has no section of its own; its changes are still under [Unreleased]
          heading = ENV["PRERELEASE"] == "true" ? "Unreleased" : version
          content = File.read("CHANGELOG.md")
          if content =~ /^## \[#{Regexp.escape(heading)}\][^\n]*\n(.*?)(?=^## \[|\z)/m && !$1.strip.empty?
            print $1.strip
          else
            print "Release v#{version}"
          end
          RUBY
          )
          {
            echo "notes<<__NOTES_EOF__"
            echo "$NOTES"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check_tag.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
          PRERELEASE: ${{ steps.check_tag.outputs.prerelease }}
        run: |
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS=(--prerelease --latest=false)
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$NOTES" \
            "${FLAGS[@]}"
