name: E2E

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  with_sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Scenario with sqlite

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run exwiw
        run: e2e/test_with_sqlite.sh

      - name: Run exwiw (--config file)
        run: e2e/test_with_sqlite_config.sh

      - name: Run exwiw (from clean target DB)
        run: e2e/test_with_sqlite_from_clean.sh

      - name: Run exwiw (scope-column mode)
        run: e2e/test_with_sqlite_scope.sh

      - name: Run exwiw (batch_scope, one query per scope-id slice)
        run: e2e/test_with_sqlite_batch_scope.sh

      - name: Run exwiw (explain)
        run: e2e/test_explain_with_sqlite.sh

  with_mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Scenario with mysql
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: exwiw_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run exwiw
        run: e2e/test_with_mysql.sh

      - name: Run exwiw (from clean target DB)
        run: e2e/test_with_mysql_from_clean.sh

      - name: Run exwiw (scope-column mode, materialized scope id-sets)
        run: e2e/test_with_mysql_scope.sh

      - name: Run exwiw (batch_scope, one query per scope-id slice)
        run: e2e/test_with_mysql_batch_scope.sh

      - name: Run exwiw (explain)
        run: e2e/test_explain_with_mysql.sh

  with_postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Scenario with postgres
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: exwiw_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-17
        # exwiw shells out to pg_dump to generate insert-000-schema.sql, and
        # pg_dump enforces a strict major-version match with the server.
        # ubuntu-latest's default pg_dump is older than 17, so install pgdg's pg17 client.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run exwiw
        run: e2e/test_with_postgresql.sh

      - name: Run exwiw (from clean target DB)
        run: e2e/test_with_postgresql_from_clean.sh

      - name: Run exwiw (copy mode)
        run: e2e/test_with_postgresql_copy.sh

      - name: Run exwiw (batch_scope, one query per scope-id slice)
        run: e2e/test_with_postgresql_batch_scope.sh

      - name: Run exwiw (explain)
        run: e2e/test_explain_with_postgresql.sh

  with_mongodb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Scenario with mongodb
    env:
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: 27017

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install mongosh
        # The mongo:7 service container has mongosh inside it, but the
        # ubuntu-latest host does not. The from-clean scenario shells out to
        # mongosh from the host to apply insert-000-schema.js, so install it
        # via MongoDB's apt repo.
        #
        # The repo path is pinned to `jammy` rather than `$(lsb_release -cs)`
        # because MongoDB's 7.0 apt index does not always carry an entry for
        # the latest Ubuntu codename used by ubuntu-latest. mongosh itself is
        # codename-agnostic, so the jammy build runs fine on newer hosts.
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-7.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          mongosh --version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run exwiw
        run: e2e/test_with_mongodb.sh

      - name: Run exwiw (from clean target DB)
        run: e2e/test_with_mongodb_from_clean.sh

      - name: Run exwiw (--ids-field target)
        run: e2e/test_with_mongodb_ids_field.sh

      - name: Run exwiw (--parallel-workers, 3-phase, byte-identical to serial)
        run: e2e/test_with_mongodb_parallel.sh
